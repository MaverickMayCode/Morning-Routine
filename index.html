<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>N10-009 Video Log</title>
<style>
  :root {
    --bg: #0A0E12;
    --panel: #11161C;
    --panel-2: #0D1216;
    --border: #1E2831;
    --border-soft: #17202A;
    --accent: #35D0BA;
    --accent-dim: #1E7A6C;
    --amber: #E8A33D;
    --text: #D7E1E8;
    --text-muted: #6E7F8A;
    --text-dim: #465560;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    background: var(--bg);
    color: var(--text);
    font-family: 'IBM Plex Sans', -apple-system, sans-serif;
  }

  body {
    padding: 28px 16px 60px;
  }

  .wrap {
    max-width: 640px;
    margin: 0 auto;
  }

  header {
    margin-bottom: 20px;
  }

  .kicker {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12px;
    color: var(--text-dim);
    letter-spacing: 0.02em;
    margin: 0 0 4px;
  }

  h1 {
    font-size: 21px;
    font-weight: 600;
    margin: 0;
    letter-spacing: -0.01em;
  }

  .stats-row {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    gap: 1px;
    background: var(--border);
    border: 1px solid var(--border);
    border-radius: 6px;
    overflow: hidden;
    margin-top: 18px;
  }

  .stat {
    background: var(--panel);
    padding: 14px 12px;
  }

  .stat-label {
    font-size: 11px;
    color: var(--text-muted);
    margin: 0 0 6px;
  }

  .stat-value {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 20px;
    font-weight: 500;
    color: var(--text);
    margin: 0;
  }

  .stat-value.accent { color: var(--accent); }

  .finish-panel {
    margin-top: 10px;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 16px;
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 12px;
    flex-wrap: wrap;
  }

  .finish-label {
    font-size: 12px;
    color: var(--text-muted);
  }

  .finish-date {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 22px;
    color: var(--amber);
    font-weight: 500;
  }

  .finish-date.done { color: var(--accent); }

  .rate-control {
    margin-top: 10px;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 14px 16px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
  }

  .rate-label {
    font-size: 13px;
    color: var(--text);
  }

  .rate-sub {
    font-size: 11px;
    color: var(--text-dim);
    margin-top: 2px;
  }

  .rate-input-group {
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .rate-btn {
    width: 30px;
    height: 30px;
    border: 1px solid var(--border);
    background: var(--panel-2);
    color: var(--text);
    border-radius: 4px;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 16px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .rate-btn:active { background: var(--border); }

  .rate-input {
    width: 48px;
    text-align: center;
    background: var(--panel-2);
    border: 1px solid var(--border);
    color: var(--accent);
    font-family: 'IBM Plex Mono', monospace;
    font-size: 15px;
    border-radius: 4px;
    padding: 6px 2px;
  }

  .rate-input:focus { outline: 1px solid var(--accent); }

  .hopbar {
    margin-top: 10px;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 12px 16px;
  }

  .hopbar-track {
    display: flex;
    gap: 2px;
    overflow-x: auto;
    padding-bottom: 4px;
  }

  .hop {
    flex: 0 0 5px;
    height: 20px;
    background: var(--border);
    border-radius: 1px;
  }

  .hop.done {
    background: var(--accent);
  }

  .list-panel {
    margin-top: 18px;
  }

  .list-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 8px;
  }

  .list-title {
    font-size: 13px;
    color: var(--text-muted);
  }

  .filter-btn {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    color: var(--text-muted);
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 5px 9px;
    cursor: pointer;
  }

  .filter-btn.active {
    color: var(--accent);
    border-color: var(--accent-dim);
  }

  .video-list {
    border: 1px solid var(--border);
    border-radius: 6px;
    overflow: hidden;
  }

  .video-row {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 10px 14px;
    background: var(--panel);
    border-bottom: 1px solid var(--border-soft);
  }

  .video-row:last-child { border-bottom: none; }

  .video-row.watched {
    background: var(--panel-2);
  }

  .video-check {
    width: 20px;
    height: 20px;
    flex: 0 0 20px;
    border: 1px solid var(--border);
    border-radius: 4px;
    background: var(--panel-2);
    cursor: pointer;
    position: relative;
  }

  .video-row.watched .video-check {
    background: var(--accent-dim);
    border-color: var(--accent);
  }

  .video-row.watched .video-check::after {
    content: '';
    position: absolute;
    left: 6px;
    top: 2px;
    width: 5px;
    height: 9px;
    border: solid var(--accent);
    border-width: 0 2px 2px 0;
    transform: rotate(40deg);
  }

  .video-num {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 13px;
    color: var(--text-dim);
    flex: 0 0 32px;
  }

  .video-row.watched .video-num {
    color: var(--text-muted);
  }

  .video-title {
    flex: 1 1 auto;
    font-size: 14px;
    color: var(--text-muted);
    background: transparent;
    border: none;
    padding: 4px 0;
    font-family: inherit;
  }

  .video-row.watched .video-title {
    color: var(--text);
  }

  .video-title:focus {
    outline: none;
    color: var(--text);
  }

  .video-date {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12px;
    color: var(--text-dim);
    background: transparent;
    border: 1px solid transparent;
    border-radius: 4px;
    padding: 4px 6px;
    flex: 0 0 108px;
    text-align: right;
  }

  .video-row.watched .video-date {
    color: var(--amber);
    border-color: var(--border);
  }

  .video-date:focus {
    outline: none;
    border-color: var(--accent-dim);
  }

  .reset-row {
    margin-top: 16px;
    text-align: right;
  }

  .reset-btn {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    color: var(--text-dim);
    background: none;
    border: none;
    cursor: pointer;
    padding: 4px;
  }

  .reset-btn:hover { color: var(--text-muted); }

  .status-line {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    color: var(--text-dim);
    text-align: center;
    margin-top: 18px;
  }

  input[type="date"]::-webkit-calendar-picker-indicator {
    filter: invert(0.5);
  }
</style>
</head>
<body>
<div class="wrap">

  <header>
    <p class="kicker">CompTIA N10-009</p>
    <h1>Video progress log</h1>
  </header>

  <div class="stats-row">
    <div class="stat">
      <p class="stat-label">Watched</p>
      <p class="stat-value accent" id="statWatched">0 / 87</p>
    </div>
    <div class="stat">
      <p class="stat-label">Remaining</p>
      <p class="stat-value" id="statRemaining">87</p>
    </div>
    <div class="stat">
      <p class="stat-label">Days needed</p>
      <p class="stat-value" id="statDays">—</p>
    </div>
  </div>

  <div class="finish-panel">
    <span class="finish-label">Expected finish date</span>
    <span class="finish-date" id="finishDate">—</span>
  </div>

  <div class="rate-control">
    <div>
      <div class="rate-label">Videos per day</div>
      <div class="rate-sub">Used to project the finish date</div>
    </div>
    <div class="rate-input-group">
      <button class="rate-btn" id="rateDown">−</button>
      <input class="rate-input" id="rateInput" type="number" min="1" step="1" value="1">
      <button class="rate-btn" id="rateUp">+</button>
    </div>
  </div>

  <div class="hopbar">
    <div class="hopbar-track" id="hopTrack"></div>
  </div>

  <div class="list-panel">
    <div class="list-header">
      <span class="list-title">87 videos</span>
      <button class="filter-btn active" id="filterToggle">Show all</button>
    </div>
    <div class="video-list" id="videoList"></div>
  </div>

  <div class="reset-row">
    <button class="reset-btn" id="resetBtn">Clear all logged videos</button>
  </div>

  <p class="status-line" id="statusLine">Loading saved log…</p>

</div>

<script>
const TOTAL_VIDEOS = 87;
const STORAGE_KEY = 'n10009-video-log';

let state = {
  rate: 1,
  videos: {} // { "1": { watched: true, date: "2026-09-01", title: "" } }
};

let showOnlyUnwatched = false;

function todayISO() {
  const d = new Date();
  d.setMinutes(d.getMinutes() - d.getTimezoneOffset());
  return d.toISOString().slice(0, 10);
}

function formatDisplayDate(iso) {
  const d = new Date(iso + 'T00:00:00');
  return d.toLocaleDateString('en-US', { month: 'short', day: '2-digit', year: 'numeric' });
}

async function loadState() {
  try {
    const result = await window.storage.get(STORAGE_KEY, false);
    if (result && result.value) {
      const parsed = JSON.parse(result.value);
      state.rate = parsed.rate || 1;
      state.videos = parsed.videos || {};
    }
  } catch (e) {
    // no saved state yet
  }
  document.getElementById('rateInput').value = state.rate;
  render();
  document.getElementById('statusLine').textContent = 'Saved locally to your account.';
}

async function saveState() {
  try {
    await window.storage.set(STORAGE_KEY, JSON.stringify(state), false);
  } catch (e) {
    document.getElementById('statusLine').textContent = 'Save failed. Changes may not persist.';
  }
}

function watchedCount() {
  return Object.values(state.videos).filter(v => v && v.watched).length;
}

function computeFinish() {
  const watched = watchedCount();
  const remaining = TOTAL_VIDEOS - watched;
  const rate = Math.max(1, state.rate);

  if (remaining <= 0) {
    return { remaining: 0, days: 0, dateLabel: 'Complete', done: true };
  }

  const days = Math.ceil(remaining / rate);
  const finish = new Date();
  finish.setDate(finish.getDate() + days);
  const dateLabel = finish.toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric', year: 'numeric' });

  return { remaining, days, dateLabel, done: false };
}

function renderStats() {
  const watched = watchedCount();
  const { remaining, days, dateLabel, done } = computeFinish();

  document.getElementById('statWatched').textContent = `${watched} / ${TOTAL_VIDEOS}`;
  document.getElementById('statRemaining').textContent = remaining;
  document.getElementById('statDays').textContent = done ? '0' : days;

  const finishEl = document.getElementById('finishDate');
  finishEl.textContent = dateLabel;
  finishEl.classList.toggle('done', done);
}

function renderHopbar() {
  const track = document.getElementById('hopTrack');
  track.innerHTML = '';
  for (let i = 1; i <= TOTAL_VIDEOS; i++) {
    const hop = document.createElement('div');
    hop.className = 'hop' + (state.videos[i]?.watched ? ' done' : '');
    track.appendChild(hop);
  }
}

function renderList() {
  const list = document.getElementById('videoList');
  list.innerHTML = '';

  for (let i = 1; i <= TOTAL_VIDEOS; i++) {
    const entry = state.videos[i] || { watched: false, date: '', title: '' };
    if (showOnlyUnwatched && entry.watched) continue;

    const row = document.createElement('div');
    row.className = 'video-row' + (entry.watched ? ' watched' : '');

    const check = document.createElement('div');
    check.className = 'video-check';
    check.addEventListener('click', () => toggleWatched(i));

    const num = document.createElement('span');
    num.className = 'video-num';
    num.textContent = String(i).padStart(3, '0');

    const title = document.createElement('input');
    title.className = 'video-title';
    title.type = 'text';
    title.placeholder = `Video ${i}`;
    title.value = entry.title || '';
    title.addEventListener('change', (e) => {
      setVideo(i, { title: e.target.value });
    });

    const date = document.createElement('input');
    date.className = 'video-date';
    date.type = 'date';
    date.value = entry.date || '';
    date.disabled = !entry.watched;
    date.addEventListener('change', (e) => {
      setVideo(i, { date: e.target.value });
    });

    row.appendChild(check);
    row.appendChild(num);
    row.appendChild(title);
    row.appendChild(date);
    list.appendChild(row);
  }
}

function setVideo(index, patch) {
  const current = state.videos[index] || { watched: false, date: '', title: '' };
  state.videos[index] = { ...current, ...patch };
  saveState();
  render();
}

function toggleWatched(index) {
  const current = state.videos[index] || { watched: false, date: '', title: '' };
  const nowWatched = !current.watched;
  state.videos[index] = {
    ...current,
    watched: nowWatched,
    date: nowWatched ? (current.date || todayISO()) : current.date
  };
  saveState();
  render();
}

function render() {
  renderStats();
  renderHopbar();
  renderList();
}

document.getElementById('rateInput').addEventListener('change', (e) => {
  const val = Math.max(1, parseInt(e.target.value, 10) || 1);
  state.rate = val;
  e.target.value = val;
  saveState();
  renderStats();
});

document.getElementById('rateUp').addEventListener('click', () => {
  state.rate = Math.max(1, state.rate + 1);
  document.getElementById('rateInput').value = state.rate;
  saveState();
  renderStats();
});

document.getElementById('rateDown').addEventListener('click', () => {
  state.rate = Math.max(1, state.rate - 1);
  document.getElementById('rateInput').value = state.rate;
  saveState();
  renderStats();
});

document.getElementById('filterToggle').addEventListener('click', (e) => {
  showOnlyUnwatched = !showOnlyUnwatched;
  e.target.textContent = showOnlyUnwatched ? 'Show all' : 'Show unwatched';
  e.target.classList.toggle('active', true);
  renderList();
});

document.getElementById('resetBtn').addEventListener('click', () => {
  if (!confirm('Clear all logged videos? This cannot be undone.')) return;
  state.videos = {};
  saveState();
  render();
});

loadState();
</script>
</body>
</html>
